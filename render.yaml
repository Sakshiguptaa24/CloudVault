# Render Blueprint specification for CloudVault
services:
  - type: web
    name: cloudvault-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"
      - key: STORAGE_PROVIDER
        value: "mock" # Set to "gcs" when connecting Google Cloud Storage
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      # For Persistent Database (recommended for production):
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: cloudvault-db
      #     property: connectionString

# Optional free PostgreSQL database on Render
# databases:
#   - name: cloudvault-db
#     plan: free

